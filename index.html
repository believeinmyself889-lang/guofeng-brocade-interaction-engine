<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brocade Weaving Interaction</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f5f5f7;
        --ink-rgb: 245, 245, 247;
        --muted: rgba(245, 245, 247, 0.58);
        --hairline: rgba(255, 255, 255, 0.14);
        --surface: #050505;
        --surface-rgb: 5, 5, 5;
        --blue: var(--ink);
        --white: var(--surface);
        --soft: rgba(22, 22, 24, 0.7);
        --button-shadow: rgba(0, 0, 0, 0.34);
        --button-shadow-hover: rgba(0, 0, 0, 0.44);
        --inset-highlight: rgba(255, 255, 255, 0.1);
        --inset-highlight-hover: rgba(255, 255, 255, 0.16);
        --glow-center: rgba(255, 255, 255, 0.055);
        --glow-left: rgba(88, 135, 126, 0.055);
        --glow-right: rgba(192, 91, 48, 0.045);
        --page-gradient: linear-gradient(180deg, #070707 0%, #050505 100%);
        --track: rgba(255, 255, 255, 0.14);
      }

      body[data-theme="light"] {
        color-scheme: light;
        --ink: #15130f;
        --ink-rgb: 21, 19, 15;
        --muted: rgba(21, 19, 15, 0.58);
        --hairline: rgba(21, 19, 15, 0.14);
        --surface: #f8f3e9;
        --surface-rgb: 248, 243, 233;
        --white: var(--surface);
        --soft: rgba(255, 252, 244, 0.76);
        --button-shadow: rgba(68, 48, 23, 0.12);
        --button-shadow-hover: rgba(68, 48, 23, 0.16);
        --inset-highlight: rgba(255, 255, 255, 0.8);
        --inset-highlight-hover: rgba(255, 255, 255, 0.95);
        --glow-center: rgba(216, 170, 67, 0.11);
        --glow-left: rgba(91, 184, 173, 0.065);
        --glow-right: rgba(216, 103, 63, 0.055);
        --page-gradient: linear-gradient(180deg, #fbf7ef 0%, #f8f3e9 100%);
        --track: rgba(21, 19, 15, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--white);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "SF Pro Text", "Helvetica Neue", sans-serif;
      }

      body {
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      body::before {
        position: fixed;
        inset: -20vh -12vw;
        z-index: 0;
        pointer-events: none;
        content: "";
        background:
          radial-gradient(circle at 50% 42%, var(--glow-center), transparent 28%),
          radial-gradient(circle at 22% 68%, var(--glow-left), transparent 25%),
          radial-gradient(circle at 82% 66%, var(--glow-right), transparent 24%),
          var(--page-gradient);
      }

      #app,
      #stage {
        position: fixed;
        inset: 0;
      }

      #stage {
        width: 100vw;
        height: 100vh;
        display: block;
        cursor: crosshair;
        touch-action: none;
        z-index: 1;
      }

      #handVideo {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      #uploadPanel {
        position: fixed;
        left: 50%;
        top: 50%;
        z-index: 4;
        display: grid;
        justify-items: center;
        gap: 14px;
        transform: translate(-50%, -50%);
        transition:
          top 520ms cubic-bezier(0.2, 0.8, 0.2, 1),
          transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 320ms ease;
      }

      body.has-design #uploadPanel {
        top: 24px;
        transform: translate(-50%, 0);
      }

      #uploadButton {
        min-width: 168px;
        height: 48px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: var(--soft);
        color: var(--ink);
        box-shadow:
          0 18px 42px var(--button-shadow),
          inset 0 1px 0 var(--inset-highlight);
        font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          sans-serif;
        letter-spacing: 0;
        backdrop-filter: blur(20px) saturate(1.24);
        -webkit-backdrop-filter: blur(20px) saturate(1.24);
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          color 180ms ease,
          box-shadow 180ms ease;
      }

      #uploadButton:hover {
        transform: translateY(-1px);
        border-color: rgba(var(--ink-rgb), 0.34);
        color: var(--blue);
        box-shadow:
          0 22px 50px var(--button-shadow-hover),
          inset 0 1px 0 var(--inset-highlight-hover);
      }

      #uploadButton:active {
        transform: scale(0.985);
      }

      #uploadInput {
        display: none;
      }

      #status {
        min-height: 17px;
        max-width: min(76vw, 420px);
        color: var(--muted);
        font: 400 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          sans-serif;
        text-align: center;
        letter-spacing: 0;
      }

      #progressRail {
        position: fixed;
        left: 50%;
        bottom: 30px;
        z-index: 3;
        width: min(240px, 48vw);
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--track);
        opacity: 0;
        transform: translateX(-50%);
        transition: opacity 320ms ease;
      }

      body.has-design #progressRail {
        opacity: 1;
      }

      #progressFill {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: var(--ink);
        transform: scaleX(0);
        transform-origin: left center;
      }

      #controlPanel {
        position: fixed;
        left: 24px;
        bottom: 22px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 42px;
        padding: 8px 11px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: var(--soft);
        box-shadow:
          0 18px 42px var(--button-shadow),
          inset 0 1px 0 var(--inset-highlight);
        color: var(--ink);
        backdrop-filter: blur(20px) saturate(1.22);
        -webkit-backdrop-filter: blur(20px) saturate(1.22);
      }

      #threadControl {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 126px;
      }

      .threadGlyph {
        position: relative;
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }

      .threadGlyph::before {
        position: absolute;
        left: 8px;
        top: 2px;
        width: 3px;
        height: 14px;
        border-radius: 999px;
        background: var(--ink);
        box-shadow: 0 0 9px rgba(var(--ink-rgb), 0.28);
        content: "";
      }

      #threadScale {
        width: 96px;
        accent-color: var(--ink);
      }

      #themeSwatches {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .swatch {
        width: 22px;
        height: 22px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        background: var(--swatch);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          0 0 0 0 rgba(var(--ink-rgb), 0);
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .swatch[data-accent] {
        display: none;
      }

      .swatch:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.34);
      }

      .swatch.is-active {
        box-shadow:
          0 0 0 3px rgba(var(--ink-rgb), 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      #quietHint {
        position: fixed;
        right: 28px;
        bottom: 24px;
        z-index: 3;
        color: var(--muted);
        font: 400 12px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          sans-serif;
        opacity: 0;
        transition: opacity 320ms ease;
      }

      body.has-design #quietHint {
        opacity: 1;
      }

      @media (max-width: 700px) {
        body.has-design #uploadPanel {
          top: 18px;
        }

        #uploadButton {
          min-width: 150px;
          height: 44px;
          font-size: 14px;
        }

        #quietHint {
          display: none;
        }

        #controlPanel {
          left: 50%;
          bottom: 18px;
          transform: translateX(-50%);
        }

        #threadControl {
          width: 108px;
        }

        #threadScale {
          width: 78px;
        }

      }
    </style>
  </head>
  <body data-theme="dark">
    <main id="app" aria-label="织锦交互">
      <canvas id="stage"></canvas>

      <section id="uploadPanel" aria-label="上传纹样">
        <button id="uploadButton" type="button">上传纹样</button>
        <input id="uploadInput" type="file" accept="image/*" />
        <div id="status" aria-live="polite">上传纹样后启用织梭</div>
      </section>

      <div id="progressRail" aria-hidden="true">
        <div id="progressFill"></div>
      </div>
      <div id="quietHint">捏合织梭并移动</div>
      <div id="controlPanel" aria-label="视觉设置">
        <label id="threadControl" aria-label="线宽">
          <span class="threadGlyph" aria-hidden="true"></span>
          <input id="threadScale" type="range" min="0.9" max="1.16" step="0.01" value="1.06" />
        </label>
        <div id="themeSwatches" aria-label="界面颜色">
          <button
            class="swatch is-active"
            type="button"
            aria-label="白色界面"
            data-theme="dark"
            style="--swatch: #050505"
          ></button>
          <button
            class="swatch"
            type="button"
            aria-label="青色界面"
            data-theme="light"
            style="--swatch: #f8f3e9"
          ></button>
          <button
            class="swatch"
            type="button"
            aria-label="朱色界面"
            data-accent="#d8673f"
            data-accent-rgb="216, 103, 63"
            style="--swatch: #d8673f"
          ></button>
          <button
            class="swatch"
            type="button"
            aria-label="金色界面"
            data-accent="#d8aa43"
            data-accent-rgb="216, 170, 67"
            style="--swatch: #d8aa43"
          ></button>
        </div>
      </div>
      <video id="handVideo" playsinline muted></video>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
